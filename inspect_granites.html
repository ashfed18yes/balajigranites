<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #222; color: #fff; font-family: sans-serif; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .card { background: #333; padding: 10px; border-radius: 8px; text-align: center; }
    img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; display: block; }
    p { margin: 8px 0 0; font-size: 11px; word-break: break-all; }
  </style>
</head>
<body>
  <h2>20 Granite Images Inspection</h2>
  <div class="grid" id="grid"></div>
  <script>
    const images = [
      "WhatsApp Image 2026-09-29 at 1.42.16 PM (1).jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.16 PM (2).jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.16 PM.jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.17 PM (1).jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.17 PM.jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.18 PM (1).jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.18 PM (2).jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.18 PM.jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.19 PM (1).jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.19 PM (2).jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.19 PM.jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.20 PM (1).jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.20 PM.jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.21 PM (1).jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.21 PM.jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.22 PM (1).jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.22 PM.jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.23 PM (1).jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.23 PM (2).jpeg",
      "WhatsApp Image 2026-09-29 at 1.42.24 PM.jpeg"
    ];
    const grid = document.getElementById('grid');
    images.forEach((img, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      const el = document.createElement('img');
      el.src = 'Granite Images/' + encodeURIComponent(img);
      const cap = document.createElement('p');
      cap.innerText = `${idx + 1}. ${img}`;
      card.appendChild(el);
      card.appendChild(cap);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
